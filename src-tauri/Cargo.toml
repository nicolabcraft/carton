[package]
name = "carton"
version = "0.1.0"
description = "Carton: subscription limits and their worth, beside Boite"
edition = "2021"
rust-version = "1.88"
publish = false
license = "MIT"
repository = "https://github.com/nicolabcraft/carton"

[lib]
name = "carton_lib"
crate-type = ["lib"]

[[bin]]
name = "carton"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
# A second launch focuses the first window instead of opening another.
tauri-plugin-single-instance = "2"
# Opens Boite's web page in the default browser.
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(unix)'.dependencies]
dirs = "6"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
